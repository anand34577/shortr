name: Release

# Triggered by pushing a semver tag, e.g.:
#   git tag v1.2.3 && git push origin v1.2.3
# Builds the frontend once, cross-compiles the Go binary for every supported
# OS/arch, publishes them (plus a SHA256SUMS file) to a GitHub Release, and
# builds+pushes a multi-arch Docker image to GHCR.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.3) — for manual re-runs"
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  binaries:
    name: Build & publish binaries
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Run tests
        run: go test ./... -count=1

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cross-compile
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}"
          build() {
            local goos=$1 goarch=$2 ext=$3
            echo "building ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="$LDFLAGS" \
              -o "dist/shortr-${goos}-${goarch}${ext}" ./cmd/shortr
          }
          build linux   amd64 ""
          build linux   arm64 ""
          build darwin  amd64 ""
          build darwin  arm64 ""
          build windows amd64 ".exe"
          ( cd dist && sha256sum * > SHA256SUMS )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*

  android:
    name: Build & publish Android APK
    runs-on: ubuntu-latest
    needs: binaries
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Add these repository secrets to publish a properly signed APK:
      #   SHORTR_KEYSTORE_BASE64 (base64 of your .jks), SHORTR_KEYSTORE_PASSWORD,
      #   SHORTR_KEY_ALIAS, SHORTR_KEY_PASSWORD. See android/README.md.
      - name: Build APK
        env:
          SHORTR_VERSION_NAME: ${{ steps.ver.outputs.name }}
          SHORTR_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_B64: ${{ secrets.SHORTR_KEYSTORE_BASE64 }}
          SHORTR_KEYSTORE_PASSWORD: ${{ secrets.SHORTR_KEYSTORE_PASSWORD }}
          SHORTR_KEY_ALIAS: ${{ secrets.SHORTR_KEY_ALIAS }}
          SHORTR_KEY_PASSWORD: ${{ secrets.SHORTR_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 -d > release.jks
            export SHORTR_KEYSTORE_FILE=release.jks
            sh ./gradlew --no-configuration-cache assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "out/shortr-android-${SHORTR_VERSION_NAME}.apk"
          else
            echo "::warning::No signing secrets; publishing a debug-signed APK."
            sh ./gradlew --no-configuration-cache assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "out/shortr-android-${SHORTR_VERSION_NAME}-debug.apk"
          fi
          ( cd out && sha256sum *.apk > SHA256SUMS-android )

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            android/out/*

  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            COMMIT=${{ steps.ver.outputs.commit }}
