# PostgreSQL-backed deployment.
#
#   docker compose -f deploy/docker-compose.postgres.yml up -d
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shortr
      POSTGRES_USER: shortr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - shortr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortr"]
      interval: 5s
      timeout: 3s
      retries: 10

  shortr:
    image: ghcr.io/yourorg/shortr:latest
    build:
      context: ..
    container_name: shortr
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SHORTR_BASE_URL: ${SHORTR_BASE_URL:-http://localhost:8080}
      SHORTR_SECRET_KEY: ${SHORTR_SECRET_KEY:?set SHORTR_SECRET_KEY}
      SHORTR_DB_DRIVER: postgres
      SHORTR_DB_DSN: postgres://shortr:${POSTGRES_PASSWORD}@postgres:5432/shortr?sslmode=disable
      SHORTR_REGISTRATION: ${SHORTR_REGISTRATION:-closed}
      SHORTR_ADMIN_EMAIL: ${SHORTR_ADMIN_EMAIL:-}
      SHORTR_ADMIN_PASSWORD: ${SHORTR_ADMIN_PASSWORD:-}
    volumes:
      - shortr-data:/data # still used for secret.key, GeoIP db, spool
    ports:
      - "${SHORTR_PORT:-8080}:8080"

volumes:
  shortr-pgdata:
  shortr-data:
