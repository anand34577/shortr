# Paste into a Nginx Proxy Manager Proxy Host's "Advanced" tab (custom
# Nginx configuration), if you want these two optional tweaks. Neither is
# required for Shortr to work.

# Pass a client-generated request id through if you set one upstream of NPM;
# Shortr generates its own X-Request-Id if this header is absent.
proxy_set_header X-Request-Id $http_x_request_id;

# Don't buffer the whole response in NPM before sending it to the client —
# matters for large CSV click exports (GET /api/v1/links/{id}/clicks/export),
# which Shortr streams rather than building in memory.
proxy_buffering off;
