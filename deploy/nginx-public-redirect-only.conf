# Paste into the PUBLIC proxy host's "Advanced" tab in Nginx Proxy Manager
# (the one Cloudflare Tunnel forwards to, e.g. sho.rt) — NOT the private
# admin host. It hard-blocks everything except the redirect hot path and
# health checks, so the admin console, API, and MCP endpoint are simply
# unreachable through this hostname regardless of what shortr itself would
# otherwise serve. This is enforced by NPM before the request ever reaches
# shortr, independent of any in-app config.
#
# Keep this in sync with shortr's route table (internal/server/routes.go) if
# you ever add new top-level path prefixes you want public.

location = /healthz { proxy_pass http://shortr:8080; }
location = /robots.txt { proxy_pass http://shortr:8080; }

location ~ ^/(app|api|auth|mcp|metrics|readyz|version) {
    return 404;
}

# Everything else (the redirect catch-all, "/{code}", and "/") falls through
# to NPM's normal proxy_pass for this host.
